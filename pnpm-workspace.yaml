packages:
  - packages/*
  - tests
  - demos/*
  - docs

catalog:
  convex: ^1.34.1
  tsdown: ^0.21.1
  typescript: ^5.9.0
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.14
  vite-plus: ^0.1.14
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.11
nodeLinker: hoisted
onlyBuiltDependencies:
  - esbuild
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
